[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  # Use specific pnpm version for reproducible builds
  PNPM_VERSION = "8"
  # Optimize Node.js for build performance
  NODE_VERSION = "18"
  NPM_FLAGS = "--prefer-offline --no-audit"

# Redirects rule for Single Page Applications (SPA)
# This ensures that all paths are served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for better performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache main app files with shorter cache for updates
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:;"

# Local development configuration
[dev]
  command = "pnpm run dev"
  port = 5173
  publish = "dist"

# Build plugin for optimizations (optional)
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
